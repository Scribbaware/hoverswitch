name: Release

# Manual only: Actions > Release > Run workflow, enter a version (e.g. v1.0.1).
# Zips the app, creates the tag and publishes a GitHub release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, e.g. v1.0.1'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          mkdir -p dist/HoverSwitch
          cp HoverSwitch.ps1 "Start HoverSwitch.cmd" README.md LICENSE dist/HoverSwitch/
          cd dist && zip -r HoverSwitch.zip HoverSwitch
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          # Running again with an existing version replaces that release (and moves its tag to this commit).
          gh release delete "$VERSION" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$VERSION" dist/HoverSwitch.zip --target "$GITHUB_SHA" \
            --title "HoverSwitch $VERSION" \
            --notes "Download **HoverSwitch.zip** below. Right-click it > Properties > tick Unblock, extract, and double-click \`Start HoverSwitch.cmd\`. See the README for details."
